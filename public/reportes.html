<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Historial de Movimientos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { corporate: { dark: '#0f172a', primary: '#1e40af', light: '#f8fafc', border: '#e2e8f0' } } } } }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800">

  <script>
    const token = localStorage.getItem('erp_token') || localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
  </script>

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white border-b border-slate-800">ERP Genética</div>
      <nav class="flex-1 p-4 space-y-2">
  <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📊 Dashboard Inventario</a>
  <a href="entradas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📥 Registro de Compras</a>
  <a href="salidas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📤 Registro de Salidas</a>
  <a href="reportes.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium shadow-xs">📑 Historial y Reportes</a>
  <a href="categorias.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">🏷️ Categorías y Almacén</a>
  <a href="usuarios.html" class="admin-only block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">👥 Gestión de Usuarios</a>
  <a href="auditoria.html" class="admin-only block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">🛡️ Auditoría del Sistema</a>
  <button onclick="descargarReporte()" class="w-full text-left block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition mt-4 border-t border-slate-700 pt-4">📑 Descargar Reporte Excel</button>
</nav>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      <header class="bg-white border-b h-16 flex items-center justify-between px-8 shadow-xs">
        <h1 class="text-lg font-semibold text-slate-700">Historial y Auditoría de Movimientos</h1>
      </header>

      <main class="p-8">
        <div class="flex space-x-4 mb-6">
          <button onclick="cambiarVista('entradas')" id="btn-tab-entradas" class="px-5 py-2.5 rounded-lg font-medium text-sm bg-corporate-primary text-white shadow-xs">📥 Historial de Entradas</button>
          <button onclick="cambiarVista('salidas')" id="btn-tab-salidas" class="px-5 py-2.5 rounded-lg font-medium text-sm bg-white border border-slate-300 text-slate-700 hover:bg-slate-50">📤 Historial de Salidas</button>
        </div>

        <div class="bg-white rounded-xl border border-corporate-border shadow-xs overflow-hidden">
          <div class="px-6 py-4 border-b bg-slate-50 flex justify-between items-center">
            <h3 id="titulo-tabla" class="font-bold text-slate-700">Movimientos de Entradas</h3>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left">
              <thead>
                <tr id="tabla-cabecera" class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b">
                  <!-- Se llena por JS -->
                </tr>
              </thead>
              <tbody class="divide-y text-sm text-slate-600" id="tabla-cuerpo"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    let vistaActual = 'entradas';

    function cambiarVista(tipo) {
      vistaActual = tipo;
      cargarDatos();
    }

    async function cargarDatos() {
      const tbody = document.getElementById('tabla-cuerpo');
      const thead = document.getElementById('tabla-cabecera');
      const res = await fetch(`/api/reporte/${vistaActual}`, { headers: { 'Authorization': `Bearer ${token}` } });
      const data = await res.json();

      if (vistaActual === 'entradas') {
        thead.innerHTML = `<th class="px-6 py-3">Producto</th><th class="px-6 py-3">Almacén</th><th class="px-6 py-3">Cantidad</th><th class="px-6 py-3">Costo</th><th class="px-6 py-3">Fecha</th>`;
        tbody.innerHTML = data.map(item => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4">${item.producto_nombre} (SKU: ${item.sku})</td>
            <td class="px-6 py-4">${item.almacen || 'Principal'}</td>
            <td class="px-6 py-4 font-bold text-emerald-600">+${item.cantidad} ${item.unidad_medida}</td>
            <td class="px-6 py-4">$${Number(item.costo_unitario).toFixed(2)}</td>
            <td class="px-6 py-4 text-xs text-slate-500">${new Date(item.fecha).toLocaleString()}</td>
          </tr>`).join('');
      } else {
        thead.innerHTML = `<th class="px-6 py-3">Producto</th><th class="px-6 py-3">Almacén</th><th class="px-6 py-3">Cantidad</th><th class="px-6 py-3">Concepto</th><th class="px-6 py-3">Fecha</th>`;
        tbody.innerHTML = data.map(item => `
          <tr class="hover:bg-slate-50">
            <td class="px-6 py-4">${item.producto_nombre} (SKU: ${item.sku})</td>
            <td class="px-6 py-4">${item.almacen || 'Principal'}</td>
            <td class="px-6 py-4 font-bold text-red-600">-${item.cantidad} ${item.unidad_medida}</td>
            <td class="px-6 py-4">${item.concepto}</td>
            <td class="px-6 py-4 text-xs text-slate-500">${new Date(item.fecha).toLocaleString()}</td>
          </tr>`).join('');
      }
    }

    async function descargarReporte() {
      const res = await fetch('/api/reporte-salidas', { headers: { 'Authorization': `Bearer ${token}` } });
      const blob = await res.blob();
      const a = document.createElement('a');
      a.href = window.URL.createObjectURL(blob); a.download = 'reporte_inventario.xlsx';
      a.click();
    }

    cargarDatos();
  </script>
</body>
</html>
