<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              corporate: {
                dark: '#0f172a',
                primary: '#1e40af',
                light: '#f8fafc',
                border: '#e2e8f0'
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800 subpixel-antialiased">

  <script>
    const token = localStorage.getItem('erp_token') || localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';

    function parseJwt(token) {
        try { return JSON.parse(atob(token.split('.')[1])); } catch (e) { return null; }
    }
    const currentUser = parseJwt(token);
    const userRole = currentUser ? currentUser.rol : 'Consulta';

    // Si no es Administrador, bloquear acceso a esta sección
    if (userRole !== 'Administrador') {
        alert('Acceso restringido: Solo los Administradores pueden gestionar usuarios.');
        window.location.href = 'index.html';
    }
  </script>

  <div class="flex h-screen overflow-hidden">
    
    <!-- Barra Lateral (Sidebar) -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white tracking-wider border-b border-slate-800 flex items-center space-x-2">
        <span>ERP Genética</span>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">📊 Dashboard Inventario</a>
        <a href="entradas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">📥 Registro de Compras</a>
        <a href="categorias.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">🏷️ Categorías</a>
        <a href="usuarios.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium transition shadow-xs">👥 Gestión de Usuarios</a>
        <button onclick="descargarReporte()" class="w-full text-left block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">📑 Descargar Reporte Excel</button>
      </nav>
      <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
        Sesión Activa • Neon DB
      </div>
    </aside>

    <!-- Contenido Principal -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      
      <header class="bg-white border-b border-corporate-border h-16 flex items-center justify-between px-8 shadow-xs">
        <h1 class="text-lg font-semibold text-slate-700">Administración de Usuarios y Permisos</h1>
        <div class="flex items-center space-x-4">
          <button onclick="cerrarSesion()" class="text-sm text-red-600 hover:text-red-800 font-medium bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">Cerrar Sesión</button>
        </div>
      </header>

      <main class="p-8 max-w-xl">
        
        <div class="bg-white rounded-xl border border-corporate-border shadow-xs overflow-hidden">
          <div class="px-6 py-4 border-b border-corporate-border bg-slate-50">
            <h3 class="font-bold text-slate-700">Registrar Nuevo Usuario</h3>
            <p class="text-xs text-slate-500 mt-1">Crea credenciales y asigna el nivel de privilegios correspondiente.</p>
          </div>
          
          <div class="p-6">
            <form id="form-usuario" class="space-y-4">
              
              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                <input type="text" id="nombre" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-corporate-primary" placeholder="Ej. Luis Rojas">
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <input type="email" id="correo" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-corporate-primary" placeholder="correo@empresa.com">
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña Temporal</label>
                <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-corporate-primary" placeholder="••••••••">
              </div>

              <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Nivel de Permisos (Rol)</label>
                <select id="rol" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none bg-white focus:ring-2 focus:ring-corporate-primary">
                  <option value="Administrador">Administrador (Control total del sistema)</option>
                  <option value="Supervisor">Supervisor / Operario (Puede registrar productos y compras)</option>
                  <option value="Consulta">Consulta (Solo lectura y descarga de Excel)</option>
                </select>
              </div>

              <div id="mensaje-estado" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>

              <div class="pt-2 flex justify-end">
                <button type="submit" id="btn-submit" class="bg-corporate-primary hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition shadow-xs">
                  Crear Usuario
                </button>
              </div>

            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script>
    async function descargarReporte() {
        try {
            const res = await fetch('/api/reporte-salidas', { headers: { 'Authorization': `Bearer ${token}` } });
            if (!res.ok) { alert("Error de sesión."); return; }
            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'reporte_inventario.xlsx';
            document.body.appendChild(a); a.click();
            a.remove(); window.URL.revokeObjectURL(url);
        } catch (error) { alert("Error al descargar Excel."); }
    }

    function cerrarSesion() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    document.getElementById('form-usuario').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-submit');
      const mensajeDiv = document.getElementById('mensaje-estado');
      
      const nombre = document.getElementById('nombre').value.trim();
      const correo = document.getElementById('correo').value.trim();
      const password = document.getElementById('password').value.trim();
      const rol = document.getElementById('rol').value;

      btn.disabled = true;
      btn.innerHTML = 'Registrando...';
      mensajeDiv.className = 'hidden';

      try {
        const respuesta = await fetch('/api/usuarios', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`
          },
          body: JSON.stringify({ nombre, correo, password, rol })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          mensajeDiv.textContent = '✅ Usuario creado exitosamente con rol de ' + rol;
          mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 block mt-4';
          document.getElementById('form-usuario').reset();
        } else {
          mensajeDiv.textContent = '❌ ' + (data.error || 'No se pudo registrar el usuario');
          mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 block mt-4';
        }
      } catch (error) {
        mensajeDiv.textContent = '❌ Error de red con el servidor.';
        mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 block mt-4';
      } finally {
        btn.disabled = false;
        btn.innerHTML = 'Crear Usuario';
      }
    });
  </script>
</body>
</html>
