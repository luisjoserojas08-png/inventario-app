<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Registro de Compras</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { corporate: { dark: '#0f172a', primary: '#1e40af', light: '#f8fafc', border: '#e2e8f0' } } } } }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white tracking-wider border-b border-slate-800">ERP Genética</div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📊 Dashboard Inventario</a>
        <a href="entradas.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium shadow-xs">📥 Registro de Compras</a>
        <a href="salidas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📤 Registro de Salidas</a>
        <a href="reportes.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">📑 Historial y Reportes</a>
        <a href="categorias.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">🏷️ Categorías y Almacén</a>
        <a href="usuarios.html" class="admin-only block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">👥 Gestión de Usuarios</a>
        <a href="auditoria.html" class="admin-only block px-4 py-2.5 rounded-lg hover:bg-slate-800 text-slate-300 transition">🛡️ Auditoría del Sistema</a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-y-auto p-8">
      <h1 class="text-2xl font-bold mb-6">Registro de Compras (Entradas)</h1>
      <div class="bg-white p-6 rounded-xl border shadow-xs max-w-lg">
        <form id="form-entrada" class="space-y-4">
          <div>
            <label class="block text-sm font-medium mb-1">Producto</label>
            <select id="producto_id" required class="w-full px-4 py-2 border rounded-lg"></select>
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium mb-1">Cantidad (use punto . para decimales)</label>
              <input type="number" id="cantidad" step="0.01" min="0.01" required class="w-full px-4 py-2 border rounded-lg" placeholder="Ej: 10.50">
            </div>
            <div>
              <label class="block text-sm font-medium mb-1">Costo Unitario ($)</label>
              <input type="number" id="costo_unitario" step="0.01" required class="w-full px-4 py-2 border rounded-lg">
            </div>
          </div>
          <div>
            <label class="block text-sm font-medium mb-1">Fecha de Ingreso Real</label>
            <input type="date" id="fecha_real" required class="w-full px-4 py-2 border rounded-lg">
          </div>
          <button type="submit" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold">Registrar Entrada</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token') || localStorage.getItem('erp_token');
    document.getElementById('fecha_real').valueAsDate = new Date();
    
    async function load() {
        const res = await fetch('/api/productos', { headers: { 'Authorization': `Bearer ${token}` } });
        const p = await res.json();
        document.getElementById('producto_id').innerHTML = p.map(x => `<option value="${x.id}">${x.nombre} (${x.unidad_medida})</option>`).join('');
    }

    document.getElementById('form-entrada').onsubmit = async (e) => {
        e.preventDefault();
        const res = await fetch('/api/entradas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
                producto_id: document.getElementById('producto_id').value,
                cantidad: document.getElementById('cantidad').value,
                costo_unitario: document.getElementById('costo_unitario').value,
                fecha: document.getElementById('fecha_real').value
            })
        });
        if(res.ok) { alert('Registrado'); location.reload(); }
        else alert('Error: ' + (await res.json()).error);
    };
    load();
  </script>
</body>
</html>
