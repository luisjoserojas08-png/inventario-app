<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Inventario</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1, h2 { color: #007bff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-size: 16px; }
        button:hover { background-color: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>📦 Sistema de Inventario</h1>
    
    <!-- Formulario para Registrar Producto -->
    <h2>Registrar Nuevo Producto</h2>
    <form id="productoForm">
        <div class="form-group">
            <label for="sku">SKU (Código):</label>
            <input type="text" id="sku" placeholder="Ej. PROD-001" required>
        </div>
        <div class="form-group">
            <label for="nombre">Nombre del Producto:</label>
            <input type="text" id="nombre" placeholder="Ej. Camiseta Polo" required>
        </div>
        <div class="form-group">
            <label for="categoria_id">ID de Categoría (ej. 1):</label>
            <input type="number" id="categoria_id" value="1" required>
        </div>
        <div class="form-group">
            <label for="stock_actual">Stock Inicial:</label>
            <input type="number" id="stock_actual" value="10" required>
        </div>
        <div class="form-group">
            <label for="precio_costo">Precio de Costo ($):</label>
            <input type="number" step="0.01" id="precio_costo" placeholder="0.00" required>
        </div>
        <button type="submit">Guardar Producto</button>
    </form>

    <hr style="margin: 30px 0;">

    <!-- Listado de Productos -->
    <h2>Inventario Actual</h2>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>SKU</th>
                <th>Nombre</th>
                <th>Stock</th>
                <th>Precio Costo</th>
            </tr>
        </thead>
        <tbody id="tablaProductos">
            <!-- Los productos se cargarán aquí automáticamente -->
        </tbody>
    </table>
</div>

<script>
    // Ruta relativa para que funcione tanto en localhost como en Render
    const API_URL = '/api/productos';

    // Función para cargar los productos en la tabla
    async function cargarProductos() {
        try {
            const respuesta = await fetch(API_URL);
            const productos = await respuesta.json();
            const tabla = document.getElementById('tablaProductos');
            tabla.innerHTML = '';

            if (productos.length === 0) {
                tabla.innerHTML = '<tr><td colspan="5" style="text-align: center;">No hay productos registrados aún.</td></tr>';
                return;
            }

            productos.forEach(p => {
                tabla.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.sku}</td>
                        <td>${p.nombre}</td>
                        <td>${p.stock_actual}</td>
                        <td>$${parseFloat(p.precio_costo).toFixed(2)}</td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error('Error al cargar productos:', error);
        }
    }

    // Enviar formulario para registrar un producto
    document.getElementById('productoForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const nuevoProducto = {
            sku: document.getElementById('sku').value.trim(),
            nombre: document.getElementById('nombre').value.trim(),
            categoria_id: parseInt(document.getElementById('categoria_id').value),
            stock_actual: parseInt(document.getElementById('stock_actual').value),
            stock_minimo: 5,
            precio_costo: parseFloat(document.getElementById('precio_costo').value)
        };

        try {
            const respuesta = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(nuevoProducto)
            });

            if (respuesta.ok) {
                alert('¡Producto registrado con éxito!');
                document.getElementById('productoForm').reset();
                // Restaurar valores predeterminados
                document.getElementById('categoria_id').value = 1;
                document.getElementById('stock_actual').value = 10;
                cargarProductos(); // Recargar la tabla
            } else {
                const errorData = await respuesta.json();
                alert(`Error: ${errorData.error || 'No se pudo registrar el producto'}`);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('Error de conexión con el servidor.');
        }
    });

    // Cargar productos al abrir la página
    cargarProductos();
</script>

</body>
</html>
