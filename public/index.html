<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicio - ERP Inventario</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BARRA DE NAVEGACIÓN -->
    <div class="navbar">
        <a href="index.html">🏠 Inicio</a>
        <a href="maestros.html">📦 Datos Maestros</a>
        <a href="movimientos.html">🔄 Movimientos</a>
        <a href="inventario.html">📊 Inventario</a>
        <a href="#" onclick="cerrarSesion()" style="background-color: #dc3545; float: right; margin-right: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <div class="container">
        <div class="panel" style="text-align: center; padding: 50px 20px;">
            <h1>Bienvenido al ERP de Gestión de Inventario</h1>
            <h2 id="mensaje_bienvenida" style="color: #0056b3; font-weight: normal; margin-bottom: 20px;"></h2>
            <p>Utiliza el menú superior para navegar entre los módulos del sistema.</p>
        </div>
    </div>

    <script>
        // 1. SEGURIDAD: Verificar si el usuario tiene un Token
        const token = localStorage.getItem('erp_token');
        if (!token) {
            window.location.href = 'login.html'; // Lo expulsa si no está logueado
        }

        // 2. PERSONALIZACIÓN: Mostrar el nombre del usuario
        const usuario = localStorage.getItem('erp_usuario');
        if (usuario) {
            document.getElementById('mensaje_bienvenida').innerText = 'Hola, ' + usuario;
        }

        // 3. FUNCIÓN DE SALIDA
        function cerrarSesion() {
            localStorage.removeItem('erp_token');
            localStorage.removeItem('erp_usuario');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
