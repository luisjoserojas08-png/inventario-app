<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>ERP - Gestión de Usuarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { theme: { extend: { colors: { corporate: { dark: '#0f172a', primary: '#1e40af', light: '#f8fafc', border: '#e2e8f0' } } } } }</script>
</head>
<body class="bg-corporate-light font-sans text-slate-800">

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar (Mismo de antes) -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white border-b border-slate-800">ERP Genética</div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">📊 Dashboard</a>
        <a href="usuarios.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium shadow-xs">👥 Gestión de Usuarios</a>
      </nav>
    </aside>

    <div class="flex-1 flex flex-col overflow-y-auto p-8">
      <h1 class="text-xl font-bold mb-6">Gestión de Accesos</h1>
      
      <!-- Tabla -->
      <div class="bg-white rounded-xl border border-corporate-border shadow-xs">
        <table class="w-full text-left">
          <thead class="bg-slate-50 border-b">
            <tr><th class="px-6 py-3">Nombre</th><th class="px-6 py-3">Usuario</th><th class="px-6 py-3">Rol</th><th class="px-6 py-3 text-right">Acciones</th></tr>
          </thead>
          <tbody id="tabla-usuarios" class="divide-y text-sm text-slate-600"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Modal de Edición -->
  <div id="modal-editar" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-lg p-6 w-96">
      <h3 class="font-bold text-lg mb-4">Editar Usuario</h3>
      <input type="hidden" id="edit-id">
      <div class="space-y-4">
        <input type="text" id="edit-nombre" class="w-full p-2 border rounded" placeholder="Nombre">
        <select id="edit-rol" class="w-full p-2 border rounded">
          <option value="Consulta">Consulta</option>
          <option value="Operario">Operario</option>
          <option value="Administrador">Administrador</option>
          <option value="Master">Master</option>
        </select>
        <input type="password" id="edit-password" class="w-full p-2 border rounded" placeholder="Nueva contraseña (dejar vacío para no cambiar)">
        <div class="flex gap-2">
          <button onclick="guardarEdicion()" class="flex-1 bg-emerald-600 text-white py-2 rounded">Guardar</button>
          <button onclick="document.getElementById('modal-editar').classList.add('hidden')" class="flex-1 bg-gray-200 py-2 rounded">Cancelar</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('erp_token');
    
    async function cargarUsuarios() {
        const res = await fetch('/api/usuarios', { headers: { 'Authorization': `Bearer ${token}` } });
        const usuarios = await res.json();
        document.getElementById('tabla-usuarios').innerHTML = usuarios.map(u => `
            <tr>
                <td class="px-6 py-4">${u.nombre}</td>
                <td class="px-6 py-4">@${u.usuario}</td>
                <td class="px-6 py-4">${u.rol}</td>
                <td class="px-6 py-4 text-right">
                    <button onclick="abrirEditar('${u.id}', '${u.nombre}', '${u.rol}')" class="text-blue-600">Editar</button>
                </td>
            </tr>
        `).join('');
    }

    function abrirEditar(id, nombre, rol) {
        document.getElementById('edit-id').value = id;
        document.getElementById('edit-nombre').value = nombre;
        document.getElementById('edit-rol').value = rol;
        document.getElementById('modal-editar').classList.remove('hidden');
    }

    async function guardarEdicion() {
        const id = document.getElementById('edit-id').value;
        const res = await fetch(`/api/usuarios/${id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
            body: JSON.stringify({
                nombre: document.getElementById('edit-nombre').value,
                rol: document.getElementById('edit-rol').value,
                password: document.getElementById('edit-password').value
            })
        });
        if (res.ok) {
            document.getElementById('modal-editar').classList.add('hidden');
            cargarUsuarios();
        } else { alert('Error al actualizar'); }
    }
    cargarUsuarios();
  </script>
</body>
</html>
