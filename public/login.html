<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              corporate: {
                dark: '#0f172a',
                primary: '#1e40af',
                light: '#f8fafc',
                border: '#e2e8f0'
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800 flex items-center justify-center h-screen">

  <div class="max-w-md w-full bg-white rounded-xl border border-corporate-border shadow-xs p-8">
    <div class="text-center mb-8">
      <h2 class="text-2xl font-bold text-slate-800">ERP Genética</h2>
      <p class="text-sm text-slate-500 mt-1">Ingresa tus credenciales para acceder</p>
    </div>

    <form id="form-login" class="space-y-6">
      <div>
       <label class="block text-sm font-medium mb-1">Usuario</label>
       <input type="text" id="usuario" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-corporate-primary" placeholder="Ej: admin">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" required class="w-full px-4 py-2 border border-slate-300 rounded-lg outline-none focus:ring-2 focus:ring-corporate-primary" placeholder="••••••••">
      </div>

      <!-- Mensaje de estado (Corregido el id a "mensaje-estado") -->
      <div id="mensaje-estado" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>

      <button type="submit" id="btn-submit" class="w-full bg-corporate-primary hover:bg-blue-700 text-white py-2.5 rounded-lg font-medium transition shadow-xs">
        Iniciar Sesión
      </button>
    </form>
  </div>

  <!-- Lógica de autenticación -->
  <script>
    document.getElementById('form-login').addEventListener('submit', async (e) => {
        e.preventDefault();
        const msg = document.getElementById('mensaje-estado');
        
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    usuario: document.getElementById('usuario').value,
                    password: document.getElementById('password').value
                })
            });
            
            const data = await res.json();
            
            if (res.ok) {
                // Guardamos el token y redirigimos al dashboard
                localStorage.setItem('erp_token', data.token);
                window.location.href = 'index.html';
            } else {
                msg.className = "px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 block mt-4";
                msg.textContent = `❌ ${data.error}`;
            }
        } catch (error) {
            console.error(error);
        }
    });
  </script>
</body>
</html>
