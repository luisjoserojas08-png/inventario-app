<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Reportes de Entradas y Salidas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { theme: { extend: { colors: { corporate: { dark: '#0f172a', primary: '#1e40af', light: '#f8fafc', border: '#e2e8f0' } } } } }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800">

  <script>
    const token = localStorage.getItem('erp_token') || localStorage.getItem('token');
    if (!token) window.location.href = 'login.html';
  </script>

  <div class="flex h-screen overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white border-b border-slate-800">ERP Genética</div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">📊 Dashboard</a>
        <a href="entradas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">📥 Registro de Compras</a>
        <a href="salidas.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">📤 Registro de Salidas</a>
        <a href="reportes.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium transition shadow-xs">📑 Historial y Reportes</a>
        <a href="categorias.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition">🏷️ Categorías</a>
        <a href="usuarios.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 transition admin-only">👥 Gestión Usuarios</a>
      </nav>
    </aside>

    <!-- Main -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      <header class="bg-white border-b h-16 flex items-center justify-between px-8 shadow-xs">
        <h1 class="text-lg font-semibold text-slate-700">Historial de Movimientos de Almacén</h1>
        <button onclick="localStorage.clear(); window.location.href='login.html'" class="text-sm text-red-600 font-medium">Cerrar Sesión</button>
      </header>

      <main class="p-8">
        <!-- Pestañas de Navegación -->
        <div class="flex space-x-4 mb-6">
          <button onclick="cambiarVista('entradas')" id="btn-tab-entradas" class="px-5 py-2.5 rounded-lg font-medium text-sm bg-corporate-primary text-white transition shadow-xs">
            📥 Historial de Entradas (Compras)
          </button>
          <button onclick="cambiarVista('salidas')" id="btn-tab-salidas" class="px-5 py-2.5 rounded-lg font-medium text-sm bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 transition">
            📤 Historial de Salidas (Despachos)
          </button>
        </div>

        <!-- Contenedor de la Tabla -->
        <div class="bg-white rounded-xl border border-corporate-border shadow-xs overflow-hidden">
          <div class="px-6 py-4 border-b border-corporate-border bg-slate-50 flex justify-between items-center">
            <h3 id="titulo-tabla" class="font-bold text-slate-700">Movimientos de Entradas Registrados</h3>
            <button onclick="cargarDatos()" class="text-sm text-corporate-primary font-medium hover:underline">Actualizar Vista</button>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr id="tabla-cabecera" class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b border-corporate-border">
                  <!-- Se llena dinámicamente -->
                </tr>
              </thead>
              <tbody class="divide-y divide-corporate-border text-sm text-slate-600" id="tabla-cuerpo">
                <tr><td colspan="6" class="px-6 py-6 text-center text-slate-400">Cargando registros...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    let vistaActual = 'entradas';

    function cambiarVista(tipo) {
      vistaActual = tipo;
      const btnEntradas = document.getElementById('btn-tab-entradas');
      const btnSalidas = document.getElementById('btn-tab-salidas');

      if (tipo === 'entradas') {
        btnEntradas.className = "px-5 py-2.5 rounded-lg font-medium text-sm bg-corporate-primary text-white transition shadow-xs";
        btnSalidas.className = "px-5 py-2.5 rounded-lg font-medium text-sm bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 transition";
        document.getElementById('titulo-tabla').textContent = "Movimientos de Entradas Registrados";
      } else {
        btnSalidas.className = "px-5 py-2.5 rounded-lg font-medium text-sm bg-corporate-primary text-white transition shadow-xs";
        btnEntradas.className = "px-5 py-2.5 rounded-lg font-medium text-sm bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 transition";
        document.getElementById('titulo-tabla').textContent = "Movimientos de Salidas Registrados";
      }
      cargarDatos();
    }

    async function cargarDatos() {
      const tbody = document.getElementById('tabla-cuerpo');
      const thead = document.getElementById('tabla-cabecera');
      tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-6 text-center text-slate-400">Cargando registros...</td></tr>`;

      try {
        const url = vistaActual === 'entradas' ? '/api/reporte/entradas' : '/api/reporte/salidas';
        const res = await fetch(url, { headers: { 'Authorization': `Bearer ${token}` } });
        const data = await res.json();

        if (!data.length) {
          tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-6 text-center text-slate-400">No hay registros disponibles.</td></tr>`;
          return;
        }

        if (vistaActual === 'entradas') {
          thead.innerHTML = `
            <th class="px-6 py-3 font-semibold">SKU</th>
            <th class="px-6 py-3 font-semibold">Producto</th>
            <th class="px-6 py-3 font-semibold">Cantidad</th>
            <th class="px-6 py-3 font-semibold">Costo Unitario</th>
            <th class="px-6 py-3 font-semibold">Stock Restante</th>
            <th class="px-6 py-3 font-semibold">Fecha</th>
          `;
          tbody.innerHTML = data.map(item => `
            <tr class="hover:bg-slate-50 transition">
              <td class="px-6 py-4 font-medium text-slate-800">${item.sku}</td>
              <td class="px-6 py-4">${item.producto_nombre}</td>
              <td class="px-6 py-4 font-semibold text-emerald-600">+${item.cantidad}</td>
              <td class="px-6 py-4">$${Number(item.costo_unitario).toFixed(2)}</td>
              <td class="px-6 py-4">${item.stock_restante}</td>
              <td class="px-6 py-4 text-slate-500">${new Date(item.fecha).toLocaleString()}</td>
            </tr>
          `).join('');
        } else {
          thead.innerHTML = `
            <th class="px-6 py-3 font-semibold">SKU</th>
            <th class="px-6 py-3 font-semibold">Producto</th>
            <th class="px-6 py-3 font-semibold">Cantidad</th>
            <th class="px-6 py-3 font-semibold">Concepto / Destino</th>
            <th class="px-6 py-3 font-semibold">Fecha</th>
          `;
          tbody.innerHTML = data.map(item => `
            <tr class="hover:bg-slate-50 transition">
              <td class="px-6 py-4 font-medium text-slate-800">${item.sku}</td>
              <td class="px-6 py-4">${item.producto_nombre}</td>
              <td class="px-6 py-4 font-semibold text-red-600">-${item.cantidad}</td>
              <td class="px-6 py-4">${item.concepto}</td>
              <td class="px-6 py-4 text-slate-500">${new Date(item.fecha).toLocaleString()}</td>
            </tr>
          `).join('');
        }
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="6" class="px-6 py-6 text-center text-red-500">Error al cargar los datos del reporte.</td></tr>`;
      }
    }

    cargarDatos();
  </script>
</body>
</html>
