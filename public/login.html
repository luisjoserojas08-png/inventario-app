<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - ERP Inventario</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              corporate: {
                dark: '#0f172a',
                primary: '#1e40af',
                light: '#f8fafc',
                border: '#e2e8f0'
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-2xl border border-slate-800 p-8">
        <div class="text-center mb-6">
            <h2 class="text-2xl font-bold text-slate-800">🔒 Acceso al Sistema</h2>
            <p class="text-sm text-slate-500 mt-1">ERP Control de Inventario</p>
        </div>
        
        <!-- Pestañas Corporativas -->
        <div class="flex bg-slate-100 p-1 rounded-xl mb-6">
            <button onclick="switchTab('login')" id="tabLogin" class="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-700 text-white shadow-xs transition">Iniciar Sesión</button>
            <button onclick="switchTab('registro')" id="tabRegistro" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition">Nuevo Usuario</button>
        </div>

        <!-- FORMULARIO DE LOGIN -->
        <form id="formLogin" class="form-section space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" id="login_correo" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none text-sm transition" required placeholder="ejemplo@empresa.com">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="login_password" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-600 outline-none text-sm transition" required>
            </div>
            <button type="submit" class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 rounded-xl transition shadow-sm mt-2">Ingresar al ERP</button>
        </form>

        <!-- FORMULARIO DE REGISTRO -->
        <form id="formRegistro" class="form-section space-y-4 hidden">
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Nombre Completo</label>
                <input type="text" id="reg_nombre" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm transition" required placeholder="Ej. Luis Rojas">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Correo Electrónico</label>
                <input type="email" id="reg_correo" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm transition" required>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">Contraseña</label>
                <input type="password" id="reg_password" class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-600 outline-none text-sm transition" required minlength="6">
            </div>
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-sm mt-2">Crear Administrador</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const tabLogin = document.getElementById('tabLogin');
            const tabRegistro = document.getElementById('tabRegistro');
            const formLogin = document.getElementById('formLogin');
            const formRegistro = document.getElementById('formRegistro');

            if(tab === 'login') {
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-700 text-white shadow-xs transition";
                tabRegistro.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
                formLogin.classList.remove('hidden');
                formRegistro.classList.add('hidden');
            } else {
                tabRegistro.className = "flex-1 py-2 text-sm font-semibold rounded-lg bg-emerald-600 text-white shadow-xs transition";
                tabLogin.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-600 hover:text-slate-900 transition";
                formRegistro.classList.remove('hidden');
                formLogin.classList.add('hidden');
            }
        }

        // REGISTRAR USUARIO
        document.getElementById('formRegistro').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                nombre: document.getElementById('reg_nombre').value,
                correo: document.getElementById('reg_correo').value,
                password: document.getElementById('reg_password').value,
                rol: 'Administrador'
            };

            const res = await fetch('/api/usuarios', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                alert('✅ ' + data.mensaje + '. Ya puedes iniciar sesión.');
                document.getElementById('formRegistro').reset();
                switchTab('login');
            } else {
                alert('❌ Error: ' + data.error);
            }
        };

        // INICIAR SESIÓN Y GUARDAR TOKEN (Usando erp_token para que coincida con el index)
        document.getElementById('formLogin').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                correo: document.getElementById('login_correo').value,
                password: document.getElementById('login_password').value
            };

            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('erp_token', data.token);
                localStorage.setItem('erp_usuario', data.usuario.nombre);
                
                window.location.href = 'index.html';
            } else {
                alert('❌ Error: ' + data.error);
            }
        };
    </script>
</body>
</html>
