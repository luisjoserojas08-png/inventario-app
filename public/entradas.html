<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP - Módulo de Entradas (CM303)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              corporate: {
                dark: '#0f172a',
                primary: '#1e40af',
                light: '#f8fafc',
                border: '#e2e8f0'
              }
            }
          }
        }
      }
    </script>
</head>
<body class="bg-corporate-light font-sans text-slate-800 subpixel-antialiased">

  <!-- Validación blindada del token al cargar la página -->
  <script>
    const token = localStorage.getItem('erp_token') || localStorage.getItem('token');
    if (!token) {
        window.location.href = 'login.html';
    }
  </script>

  <div class="flex h-screen overflow-hidden">
    
    <!-- Barra Lateral (Sidebar) -->
    <aside class="w-64 bg-corporate-dark text-slate-300 flex flex-col hidden md:flex">
      <div class="p-6 text-xl font-bold text-white tracking-wider border-b border-slate-800 flex items-center space-x-2">
        <span>ERP Genética</span>
      </div>
      <nav class="flex-1 p-4 space-y-2">
        <a href="index.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">📊 Dashboard Inventario</a>
        <a href="entradas.html" class="block px-4 py-2.5 rounded-lg bg-corporate-primary text-white font-medium transition shadow-xs">📥 Registro de Compras</a>
        <a href="categorias.html" class="block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">🏷️ Categorías</a>
        <!-- BOTÓN DE EXCEL CORREGIDO -->
        <button onclick="descargarReporte()" class="w-full text-left block px-4 py-2.5 rounded-lg hover:bg-slate-800 hover:text-white transition">📑 Descargar Reporte Excel</button>
      </nav>
      <div class="p-4 border-t border-slate-800 text-xs text-slate-500">
        Sesión Activa • Neon DB
      </div>
    </aside>

    <!-- Contenido Principal -->
    <div class="flex-1 flex flex-col overflow-y-auto">
      
      <!-- Cabecera -->
      <header class="bg-white border-b border-corporate-border h-16 flex items-center justify-between px-8 shadow-xs">
        <h1 class="text-lg font-semibold text-slate-700">Módulo de Entradas (Formato CM303)</h1>
        <div class="flex items-center space-x-4">
          <button onclick="cerrarSesion()" class="text-sm text-red-600 hover:text-red-800 font-medium bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-lg transition">Cerrar Sesión</button>
        </div>
      </header>

      <!-- Cuerpo -->
      <main class="p-8">
        
        <div class="max-w-2xl bg-white rounded-xl border border-corporate-border shadow-xs overflow-hidden">
          <div class="px-6 py-4 border-b border-corporate-border bg-slate-50">
            <h3 class="font-bold text-slate-700">Registrar Nuevo Lote de Inventario</h3>
            <p class="text-sm text-slate-500 mt-1">Ingresa los datos de la factura de compra o entrada de almacén.</p>
          </div>
          
          <div class="p-6">
            <form id="form-entradas" class="space-y-6">
              
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- SKU -->
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Código SKU</label>
                  <input type="text" id="sku" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-corporate-primary focus:border-corporate-primary outline-none transition" placeholder="Ej. IN-001">
                </div>
                
                <!-- Nombre del Producto -->
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Nombre del Producto</label>
                  <input type="text" id="nombre" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-corporate-primary focus:border-corporate-primary outline-none transition" placeholder="Ej. Alimento para Camarón">
                </div>
              </div>

              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Cantidad -->
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Cantidad Entrante</label>
                  <input type="number" id="cantidad" required min="1" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-corporate-primary focus:border-corporate-primary outline-none transition" placeholder="0">
                </div>
                
                <!-- Costo Unitario -->
                <div>
                  <label class="block text-sm font-medium text-slate-700 mb-1">Costo Unitario ($)</label>
                  <input type="number" id="costo_unitario" required min="0.01" step="0.01" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-corporate-primary focus:border-corporate-primary outline-none transition" placeholder="0.00">
                </div>
              </div>

              <!-- Mensaje de estado -->
              <div id="mensaje-estado" class="hidden px-4 py-3 rounded-lg text-sm font-medium"></div>

              <div class="pt-4 flex justify-end">
                <button type="submit" id="btn-submit" class="bg-corporate-primary hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium transition shadow-xs flex items-center">
                  Registrar Lote
                </button>
              </div>

            </form>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script>
    // 1. Función para descargar el reporte de Excel
    async function descargarReporte() {
        try {
            const res = await fetch('/api/reporte-salidas', {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (!res.ok) {
                alert("Error: Tu sesión expiró o no tienes permisos.");
                return;
            }

            const blob = await res.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'reporte_inventario.xlsx';
            document.body.appendChild(a);
            a.click();

            a.remove();
            window.URL.revokeObjectURL(url);
        } catch (error) {
            console.error("Error al descargar:", error);
            alert("Hubo un error al intentar descargar el Excel.");
        }
    }

    // 2. Función para cerrar sesión
    function cerrarSesion() {
      localStorage.removeItem('erp_token');
      localStorage.removeItem('token');
      localStorage.removeItem('erp_usuario');
      window.location.href = 'login.html';
    }

    // 3. Lógica principal para enviar el formulario
    document.getElementById('form-entradas').addEventListener('submit', async (e) => {
      e.preventDefault(); 

      const btnSubmit = document.getElementById('btn-submit');
      const mensajeDiv = document.getElementById('mensaje-estado');
      
      const sku = document.getElementById('sku').value.trim();
      const nombre = document.getElementById('nombre').value.trim();
      const cantidad = parseInt(document.getElementById('cantidad').value, 10);
      const costo_unitario = parseFloat(document.getElementById('costo_unitario').value);

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = 'Procesando...';
      mensajeDiv.className = 'hidden';

      try {
        const respuesta = await fetch('/api/entradas', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}` 
          },
          body: JSON.stringify({
            sku,
            nombre,
            categoria_id: 1, 
            cantidad,
            costo_unitario
          })
        });

        const data = await respuesta.json();

        if (respuesta.ok) {
          mensajeDiv.textContent = '✅ Lote registrado exitosamente. Ya puedes verlo en el Dashboard.';
          mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-emerald-50 text-emerald-700 block';
          document.getElementById('form-entradas').reset();
        } else {
          mensajeDiv.textContent = '❌ Error: ' + (data.error || 'No se pudo registrar');
          mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 block';
        }
      } catch (error) {
        mensajeDiv.textContent = '❌ Error de conexión con el servidor.';
        mensajeDiv.className = 'px-4 py-3 rounded-lg text-sm font-medium bg-red-50 text-red-700 block';
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = 'Registrar Lote';
      }
    });
  </script>
</body>
</html>
