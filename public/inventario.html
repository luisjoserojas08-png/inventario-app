<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - ERP</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <a href="index.html">🏠 Inicio</a>
        <a href="maestros.html">📦 Datos Maestros</a>
        <a href="movimientos.html">🔄 Movimientos</a>
        <a href="inventario.html">📊 Inventario</a>
        <a href="#" onclick="cerrarSesion()" style="background-color: #dc3545; float: right; margin-right: 20px;">🚪 Cerrar Sesión</a>
    </div>

    <div class="container">
        <div class="panel">
            <h3>Estado de Inventario (Por Lotes)</h3>
            <table>
                <thead>
                    <tr><th>Lote #</th><th>SKU</th><th>Producto</th><th>Costo</th><th>Stock Lote</th><th>Fecha</th></tr>
                </thead>
                <tbody id="tablaInventario"></tbody>
            </table>
        </div>
    </div>

    <script>
        // ==========================================
    // BLOQUE DE SEGURIDAD UNIVERSAL Y ROLES
    // ==========================================
    if (currentUser) {
        const rol = currentUser.rol;
        
        // 1. Reglas básicas por clases HTML
        if (rol !== 'Master') {
            document.querySelectorAll('.master-only').forEach(el => el.style.display = 'none');
        }
        if (rol === 'Operario' || rol === 'Consulta') {
            document.querySelectorAll('.admin-only').forEach(el => el.style.display = 'none');
        }

        // 2. Blindaje Estricto del Menú Lateral (Sidebar)
        document.querySelectorAll('aside nav a').forEach(link => {
            const href = link.getAttribute('href');
            
            // Nadie excepto Master puede ver Gestión de Usuarios
            if (href === 'usuarios.html' && rol !== 'Master') {
                link.style.display = 'none';
            }
            
            // Regla EXCLUSIVA para el rol Consulta: Solo ve 3 pantallas
            if (rol === 'Consulta') {
                const permitidos = ['index.html', 'reportes.html', 'productos.html'];
                if (!permitidos.includes(href)) {
                    link.style.display = 'none';
                }
            }
        });

        // 3. Ocultar módulos de costos visuales (Si existen en la pantalla actual)
        const puedeVerCostos = ['Master', 'Administrador', 'Consulta'].includes(rol);
        if (!puedeVerCostos) {
            const thCostoU = document.getElementById('th-costou');
            const thCostoT = document.getElementById('th-costot');
            const kpiValor = document.getElementById('kpi-valor');
            
            if (thCostoU) thCostoU.style.display = 'none';
            if (thCostoT) thCostoT.style.display = 'none';
            if (kpiValor) kpiValor.parentElement.parentElement.style.display = 'none';
        }
    }

        // SEGURIDAD
        const token = localStorage.getItem('erp_token');
        if (!token) window.location.href = 'login.html';

        function cerrarSesion() {
            localStorage.removeItem('erp_token');
            localStorage.removeItem('erp_usuario');
            window.location.href = 'login.html';
        }

        async function cargarLotes() {
            const res = await fetch('/api/inventario-lotes');
            const lotes = await res.json();
            const tabla = document.getElementById('tablaInventario');
            tabla.innerHTML = '';
            
            if(lotes.length === 0) {
                tabla.innerHTML = '<tr><td colspan="6" style="text-align:center;">Sin stock.</td></tr>';
                return;
            }

            lotes.forEach(l => {
                const color = l.stock_restante <= l.stock_minimo ? 'red' : 'green';
                tabla.innerHTML += `
                    <tr>
                        <td><strong>L-${l.lote_id}</strong></td>
                        <td>${l.sku}</td>
                        <td>${l.nombre} <small>(${l.categoria_nombre})</small></td>
                        <td>$${parseFloat(l.costo_unitario).toFixed(2)}</td>
                        <td style="color:${color}; font-weight:bold;">${l.stock_restante}</td>
                        <td>${new Date(l.fecha).toLocaleDateString()}</td>
                    </tr>`;
            });
        }
        
        window.onload = cargarLotes;
    </script>
</body>
</html>
